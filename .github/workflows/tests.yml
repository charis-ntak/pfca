# Continuous integration of the pfca package: the test suite on the three supported Python versions.
name: tests

"on":
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Show the installed versions
        run: python -m pip freeze

      - name: Run the test suite
        run: python -m pytest -q -p no:cacheprovider
