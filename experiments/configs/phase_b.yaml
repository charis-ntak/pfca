# Phase B: public benchmarks (Section 6.2)
datasets: null            # null uses the curated list in pfca.evaluation.datasets.BENCHMARKS
min_features: 15
max_features: 100
max_rows: 5000
n_repeats: 10
split_scheme: auto        # holdout (repeated 60/20/20 splits), repeated_cv (five folds: test, tuning, rest) or auto (repeated_cv below small_sample_rows rows, Section 7.3)
small_sample_rows: 500
n_explain: 200
model_classes: [gbm, rf]  # add mlp to include a non tree model class (permutation explainer, slower)
n_resamples: 100
background_size: 100
explainer: auto
methods: [pfca, pfca_crisp, pfca_single_model, pfca_fixed, shap, bootstrapped_shap, lime]   # add integrated_gradients together with the mlp model class
lime_samples: 2000        # perturbations per instance of the LIME baseline (skipped when the optional lime package is missing)
pfca:
  n_concepts_grid: [2, 3, 4, 5, 6, 8, 10, 12]
  fuzzifier_grid: [1.5, 2.0, 2.5]
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  solver: grid
  knee_method: utopia
  consensus: true         # consensus clustering over resamples of the instances (Section 10 of the guide)
perturbation_instances: 20
n_perturbations: 3
imputation: conditional
n_jobs: 4
