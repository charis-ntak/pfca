# Phase C: psychological questionnaire with known subscales (Section 6.3)
# The real dataset is not distributed; place it under data/raw/ (ignored by git) and see data/README.md
# for the CSV and JSON formats. experiments/make_demo_questionnaire.py writes a simulated file for testing.
csv_path: data/raw/questionnaire.csv
spec_path: data/raw/questionnaire_spec.json
n_repeats: 10
n_explain: 200
model_classes: [gbm, rf, mlp]
n_resamples: 100
background_size: 100
explainer: auto
methods: [pfca, pfca_apriori, pfca_crisp, pfca_single_model, shap, bootstrapped_shap, grouped_shap]
pfca:
  n_concepts_grid: [2, 3, 4, 5, 6, 8]
  fuzzifier_grid: [1.5, 2.0, 2.5]
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  solver: grid
  knee_method: utopia
perturbation_instances: 20
n_perturbations: 3
imputation: conditional
grouped_background: 50
example_instances: [0, 1, 2]
seed: 0          # base seed; repetition r uses seed + r for the pool, the tuning and the background samples
split_seed: 0    # seed of the repeated 60/20/20 splits
n_jobs: 4
