# Sensitivity analyses (Section 7.5) on a subset of Phase A cells.
# One attribution pool per cell and seed is fitted at the largest number of resamples with every
# model class; smaller B and M are subsets of that pool. Factors are varied one at a time around
# the default setting given under "defaults" (B 100, M 3, trapezoidal, 5/95 and 25/75, correlation
# distance, grid solver, utopia knee).
cells:
  - {family: additive, n_samples: 500, n_features: 30, rho: 0.6}
  - {family: redundancy, n_samples: 500, n_features: 30, rho: 0.6}
  - {family: interaction, n_samples: 500, n_features: 30, rho: 0.9}
n_seeds: 10
n_explain: 200
tune_fraction: 0.34
model_classes: [gbm, rf, mlp]   # a ridge model is appended when model_class_counts asks for a fourth class
background_size: 100
explainer: auto
resamples: [20, 50, 100, 200]
model_class_counts: [1, 2, 3, 4]
shapes: [trapezoidal, triangular]
percentiles:
  - {support: [5, 95], core: [25, 75]}
  - {support: [2.5, 97.5], core: [25, 75]}
  - {support: [10, 90], core: [30, 70]}
distances: [correlation, loading]
solvers: [grid, nsga2]
knee_methods: [utopia, hyperplane, sparsest_within_10pct, median_complexity]
defaults:
  n_resamples: 100
  n_model_classes: 3
  fuzzy_shape: trapezoidal
  support_percentiles: [5, 95]
  core_percentiles: [25, 75]
  concept_distance: correlation
  solver: grid
  knee_method: utopia
nsga_pop_size: 40
nsga_generations: 30
include_apriori: false  # the true blocks of a simulation are not domain knowledge (Section 3.2)           # the true block partition enters as a candidate, as for pfca in Phase A
pfca:
  n_concepts_grid: [2, 3, 4, 5, 6, 8]
  fuzzifier_grid: [1.5, 2.0, 2.5]
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  disagreement_threshold: 0.5
perturbation_instances: 0       # perturbation stability is not a sensitivity metric; set above zero to compute it
n_perturbations: 0
imputation: conditional
n_jobs: 4
