# Small configuration to check that the whole Phase A pipeline runs end to end
families: [additive, redundancy]
n_samples: [200]
n_features: [10]
rhos: [0.6]
n_seeds: 1
n_explain: 30
tune_fraction: 0.34
model_classes: [gbm, rf]
n_resamples: 4
background_size: 40
explainer: auto
methods: [pfca, pfca_crisp, pfca_single_model, pfca_fixed, pfca_apriori, shap, bootstrapped_shap, grouped_shap]
pfca:
  n_concepts_grid: [2, 3, 4]
  fuzzifier_grid: [2.0]
  alpha_grid: [0.0, 0.5, 1.0]
  solver: grid
  knee_method: utopia
  fuzzy_shape: trapezoidal
  disagreement_threshold: 0.5
perturbation_instances: 5
n_perturbations: 1
imputation: conditional
grouped_background: 30
n_jobs: 4
